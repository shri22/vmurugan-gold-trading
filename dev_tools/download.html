<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download VMurugan Gold Trading App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #d4af37; }
        .spinner {
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .links { margin-top: 20px; display: none; }
        .links a {
            display: block;
            margin: 10px 0;
            padding: 10px;
            background: #d4af37;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VMurugan Gold</h1>
        <p>Redirecting you to the app store...</p>
        <div class="spinner"></div>
        
        <div class="links" id="manualLinks">
            <p>If you are not redirected automatically, please click below:</p>
            <a href="https://play.google.com/store/apps/details?id=com.vmurugan.digi_gold">Download for Android</a>
            <!-- Replace YOUR_APPLE_APP_ID with your actual Apple App Store ID once published -->
            <a href="https://apps.apple.com/app/idYOUR_APPLE_APP_ID">Download for iPhone</a>
        </div>
    </div>

    <script>
        // App URLs
        const androidUrl = "https://play.google.com/store/apps/details?id=com.vmurugan.digi_gold";
        const iosUrl = "https://apps.apple.com/app/id6755655102";
        const fallbackUrl = "https://api.vmuruganjewellery.co.in";

        // Detect OS
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        
        setTimeout(() => {
            if (/android/i.test(userAgent)) {
                window.location.href = androidUrl;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = iosUrl;
            } else {
                // Show manual links if on desktop or unknown device
                document.getElementById('manualLinks').style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
            }
        }, 1000); // 1 second delay to allow UI to render
    </script>
</body>
</html>
